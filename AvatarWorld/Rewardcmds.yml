ranksettask:
  type: task
  debug: false
  script: 
      - playsound <player.location> sound:CHEST_OPEN volume:0.8 pitch:0.5
      - execute as_server "lp user <player.name> parent addtemp d3 13w"
      - wait 1
      - narrate "<gray>[<blue>Crate<gray>] <gold>You have redeemed 3 Months Of Donator Rank 3! Congrats!"

randomizercmd:
  type: command
  debug: false
  name: randomizer
  usage: /randomizer (thing) (player) 
  permission: cmd.randomperk
  permission message: You can't use my command because you don't have the permission '<permission>'! 
  description: Run this command to give yourself a random perk.
  script:
  - choose <c.args.get[1]||null>:
    - case perk:
      - define player "<c.args.get[2]>"
      - run randomperktask instantly player:<server.match_player[<def[player]>]>
    - case moneysmall:
      - define player "<c.args.get[2]>"
      - run randommoneysmalltask instantly player:<server.match_player[<def[player]>]>
    - case money:
      - define player "<c.args.get[2]>"
      - run randommoneytask instantly player:<server.match_player[<def[player]>]>
    - case rank3:
      - define player "<c.args.get[2]>"
      - run ranksettask instantly player:<server.match_player[<def[player]>]>
    - case safarinet:
      - define player "<c.args.get[2]>"
      - run safarinet instantly player:<server.match_player[<def[player]>]>
    - case randomperklitetask:
      - define player "<c.args.get[2]>"
      - run randomperklitetask instantly player:<server.match_player[<def[player]>]>
    - case randomperktask:
      - define player "<c.args.get[2]>"
      - run randomperktask instantly player:<server.match_player[<def[player]>]>
    - case randomperkmediumtask:
      - define player "<c.args.get[2]>"
      - run randomperkmediumtask instantly player:<server.match_player[<def[player]>]>
safarinet:
  type: task
  debug: true
  script:
    - define egg <util.random.int[1].to[5]>
    - playsound <player.location> sound:CHEST_OPEN volume:0.8 pitch:0.5
    - execute as_server "safarinet give <player.name> reusable <def[egg]>"
    - wait 1
    - narrate "<gray>[<blue>Crate<gray>] <gold>You have recieved <green><def[egg]> <yellow>Eggs<gold>!"
randomperklitetask:
  type: task
  debug: false
  script:
  - random: 
    - repeat 1:
      - playsound <player.location> sound:CHEST_OPEN volume:0.8 pitch:0.5
      - wait 1
      - narrate "<gray>[<blue>Crate<gray>] <gold>You have recieved 50 Resource Points for your nation!"

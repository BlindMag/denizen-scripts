Maci:
  type: assignment
  interact scripts:
  - 30 Osirenpc
  actions: 
    on assignment: 
      - ^trigger name:chat state:true 
      - ^trigger name:click state:true 
      - ^trigger name:proximity state:true 
      - ^trigger name:damage state:false 
      - ^lookclose true range:4 realistic
Macinpc:
  type: interact
  steps:
    1:
      click trigger:
        script:
          - engeage 
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Hello, I'm Maci."
          - wait 2
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>My mother is the head of the council...."
          - wait 3
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Alot rides on my shoulders to take care of the men and women refugees who come here."
          - wait 4
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I mean it's mostly up to me and I'm just not sure if I can do it."
          - wait 2
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Anyway, do excuse me, I must get back to cooking for the evening."
          - wait 4
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Then I have to coordinate the fishing team."
          - wait 4
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Do the dishes...."
          - wait 3
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Wash the clothes....."
          - wait 2
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Get the big comforters ready for the cold this evening....."
          - disengage
Osire:
  type: assignment
  interact scripts:
  - 30 Osirenpc
  actions: 
    on assignment: 
      - ^trigger name:chat state:true 
      - ^trigger name:click state:true 
      - ^trigger name:proximity state:true 
      - ^trigger name:damage state:false 

AlexNPC:
  type: interact
  steps:
    1:
      click trigger:
        script:
          - engage
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I think some of these girls here are just plain rude."
          - wait 4
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>It wasn't my choice to be a firebender, yet they still hold us accountable for the actions our fathers made."
          - wait 4
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I just want to be my own person, light my own path."
          - wait 4
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>My element is a part of me, it fuels me and keeps me strong. I control it like I would control the breath in my body, yet some do not give firebenders a break."
          - wait 6
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I'd suggest firebending for anyone looking to overpower their own desires. You have to be a strong person to control it."
          - disengage

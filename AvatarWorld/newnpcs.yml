Osirenpc:
  type: interact
  steps:
    1:
      click trigger:
        script:
          - engage
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I'm just here to observe the construction of these fine buildings."
          - wait 3
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I happen to be a restoration master, I am old enough to bring the spirit of how things were a very long time ago."
          - wait 5
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I have been enjoying the time here, it's quiet, aside from a few who haven't gotten comfortable here yet. I think they are restless."
          - wait 5
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Don't get me wrong, there are some people that are not good for the community, however it takes all kinds to run a colony smoothly."
          - wait 4
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Oh my firebending? Yes it's a good element to work with, however I do wish I was an earth bender."
          - wait 4
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>My bending is more advanced, Don't go around announcing it, but if you come back to me once you reach top level I will show you some new tips and tricks, as well as guide you toward a subelement..."
          - wait 6
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Oh don't look at me that way, elements have all sorts of secrets that you can unlock. You will need the appropriate teacher to guide you."
          - wait 5
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>There are many teachers willing to take on a student of your potential, now, may your journey be full of wonder."
          - disengage


Philip:
  type: assignment
  interact scripts:
  - 30 Philipnpc
  actions: 
    on assignment: 
      - ^trigger name:chat state:true 
      - ^trigger name:click state:true 
      - ^trigger name:proximity state:true 
      - ^trigger name:damage state:false 
      - ^lookclose true range:4 realistic
Philipnpc:
  type: interact
  steps:
    1:
      click trigger:
        script:
        - if <player.item_in_hand.contains[cooked_salmon:1]> {
          - ^take cooked_fish:1
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>How.... Nevermind"
          - wait 3
          - narrate "<dark_gray>[<dark_aqua>!<dark_gray>]<gray><italic> Npc took the item in your hand, click again to talk to the npc after he has eaten."
          - ^flag player philipfed 
          - money give 500
          - zap step 2
          }
        - wait 1
        - random {
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I've got no business with you."
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>It's a cold day, get lost."
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>No body bothers to feed us, it's no wonder we're pissy."
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>What do you want? I'm hungry, leave me alone."
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>No food. No talky talky."
          } 
    2:
      click trigger:
        script:
        - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I've been a bit hasty today, maybe some fresh air would do me good."
        - wait 3
          - narrate "<dark_gray>[<dark_aqua>!<dark_gray>]<gray><italic> NPCs like this may have a quest later. Return after you've given this npc some time."




SovalNPC:
  type: interact
  steps:
    1:
      click trigger:
        script:
          - engage
          - if <player.has_flag[fedphilip]> {
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Good to see you again <player.name>. I see Philip got out of his mood, you must've done some good. Say, I've got another tip for you....
            - wait 5
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Why don't you try bringing that little toad Christin a Blue Orhid?  
            - wait 5
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I know, she doesn't deserve gifts with the way she treats others, however...
            - wait 4
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>The girls father passed before she was found abandoned in her village, she had been close to mad with the amount of diamonds she tried hording.
            - wait 5
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>They nurtured her and brought her here to live within this colony."
            - wait 5
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I knew her father when he was young, he adored blue orchids and I believe that may chill her icy soul to lay some at his memorial."
            - disengage
            - zap step:2
            - queue clear
            }
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I'm here to work on the buildings, we were brought together by the Airbenders, but we stay for the Salmon!"
          - wait 5
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>If you meet a grumpy old man who doesn't want to talk at all, try giving the old git some cooked salmon, it might calm him down a bit and he may even help you."
          - wait 5
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Be safe out there new bender."
          - disengage
          - zap step:2
    2:
      click trigger:
        script:
          - engage
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Wanting to know about earth bending huh?"
          - wait 2
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I love feeling the moving earth beneth my feet, the way the world reacts to us is one of the most delightful feelings...."
          - wait 4
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Aside from some delicious crispy skin salmon!"
          - wait 3
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Once we hone our skills, we can feel so much that we can see."
          - wait 2
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Sounds confusing? It's sort of like closing your eyes and seeing things that are near you with a clap of your hands. You know it's there even if you cannot see it."
          - wait 5 
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Oh my, I need to be on my way back to work, take care young bender."
          - walk l@worksite
          - disengage
          - zap step:3
    3:
      click trigger:
        script:
          - engage
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I've got to work now, you have a good day."
          - wait 300
          - disengage

hungry:
  type: task
  debug: true
  script:
    - engage 
    - chat 'Time to get a bite to eat. You're welcome to come with me, just don't stop in front of me, I'm starvin!' 
    - walk <npc.anchor[walktokitchen1]> 
    - wait 10s 
    - walk <npc.anchor[walktokitchen2]>
    - wait 15s 
    - walk <npc.anchor[walktokitchen3]> 
    - wait 15s
    - walk <npc.anchor[walktopond]> 
    - wait 5s
    - animate animation:sneak
    - wait 5s
    - equip hand:salmon
    - animate animation:stop_sneaking
    - chat 'Perfect!'
    - walk <npc.anchor[walktokitchen4]>
    - wait 15s
    - walk <npc.anchor[walktokitchen5]>  
    - wait 15s
    - walk <npc.anchor[walktokitchen6]>
    - disengage 



HayliaNPC:
  type: interact
  steps:
    1:
      click trigger:
        script:
          - engage
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I'm Haylia, what's your name?"
          - wait 3
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Pretty place isn't it? gotta love the effort put in here."
          - wait 4
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>You're such an interesting character."
          - wait 3
          - walk l@traininggrounds
          - disengage
          - zap step:2
    2:
      click trigger:
        script:
          - engage
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I can't believe I actually made it here, my ancestors would be so proud to have an airbender in the family..."
          - wait 4
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Airbending is so much fun, I just love zipping around on a ball or making objects work for you."
          - wait 4
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Not to mention how cute the boys think you are when you actually float into a room!"
          - wait 3
          - narrate "<aqua><italic><NPC.Name> <gray><italic>blushes and giggles..."
          - disengage
          - zap step:3
    3:
      click trigger:
        script:
          - random {
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I do have to get going now, take care!"
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>We'll meet again I'm sure of it!"
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>You're one of my favorites. Come see me again sometime soon, I have to get going for now."
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Tata for now cutie!"
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I got to get going, see you soon!"
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Oh, I do apoligize, but I am expected somewhere."
            }
          - walk l@temple

ChristinNPC:
  type: interact
  steps:
    1:
      click trigger:
        script:
        - if <player.item_in_hand.contains[blue_orchid]> {
          - engage
          - narrate "<aqua><italic><npc.name> <gray><italic>stairs down at the flower you offered her with sadness and shock..."
          - wait 2
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I've been nothing but terrible to you..."
          - wait 3
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Yet you stand before me with this, and with such sincerity..."
          - money give 1500
          - narrate "<dark_gray>[<dark_aqua>!<dark_gray>]<gray><italic> You've <green>$1500 <gray><italic>for completing a quest."
          - ^take blue_orchid
          - disengage
          - zap step:2
          }
          - random {
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Like hell you're talking to me, get lost freak."
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Ew."
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Not even close."
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I'll slap you if you get closer to me."
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Nope."
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Get lost."
            - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>How wonderfully interesting you are. Not."
            }
    2:
      click trigger:
        script:
          - engage
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>I am not ready yet to speak about things. 
          - wait 2
          - narrate "<dark_aqua>{<gold>NPC<dark_aqua>} <aqua><npc.name> <white>Give me some time and come talk to me later."
          - wait 2
          - narrate "<dark_gray>[<dark_aqua>!<dark_gray>]<gray><italic> Npcs like this one may have a quest for you in the future, return after you give them some time."
          - disengage


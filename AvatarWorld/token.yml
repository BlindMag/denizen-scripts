giveflytoken:
  type: command
  debug: false
  name: giveflytoken
  usage: /giveflytoken 
  description: Run this command to give yourself the fly token.
  script:
  - if !<player.is_op> queue clear
  - give i@flytoken[flags=hide_enchants]

tokenhandlers:
  type: world
  debug: false
  events:
    on player clicks with flytoken:
    - run flytokentask
    on player clicks with cbtoken1:
    - run cbtoken1task
    on player clicks with cbtoken2:
    - run cbtoken2task
    on player clicks with mcmmolevel1:
    - narrate "<gray>[<dark_aqua>Token<gray>] <white>You can use command /mcmmo skills (skillname) to redeem your token!"
    on player clicks with cratestoken:
    - run cratestokentask
    on player clicks with 7500token:
    - run 7500tokentask
    on player clicks with 5000token:
    - run 5000tokentask
    on player clicks with joblevel2:
    - narrate "<gray>[<dark_aqua>Token<gray>] <white>You can use command /token jobs (jobname) to redeem your job token for 5 levels!"
    on player clicks with joblevel2:
    - narrate "<gray>[<dark_aqua>Token<gray>] <white>You can use command /token jobs (jobname) to redeem your job token for 20 levels!"


flytokentask:
  type: task
  debug: false
  script:
  - ^take <player.item_in_hand>
  - inventory close d:<context.inventory>
  - playsound <player> sound:CHEST_OPEN volume:0.8 pitch:0.5
  - execute as_server "lp user <player.name> permission unsettemp cmi.command.fly"
  - wait 1
  - execute as_server "lp user <player.name> permission settemp cmi.command.fly true 3d"
  - narrate "<gray>[<dark_aqua>Token<gray>] <white>You have recieved 3 days of fly permissions!"
cbtoken1task:
  type: task
  debug: false
  script:
  - ^take <player.item_in_hand>
  - inventory close d:<context.inventory>
  - playsound <player> sound:CHEST_OPEN volume:0.8 pitch:0.5
  - execute as_server "adjustbonusclaimblocks <player.name> 100"
  - narrate "<gray>[<dark_aqua>Token<gray>] <white>You have recieved 100 claimblocks!"
cbtoken2task:
  type: task
  debug: false
  script:
  - ^take <player.item_in_hand>
  - inventory close d:<context.inventory>
  - playsound <player> sound:CHEST_OPEN volume:0.8 pitch:0.5
  - execute as_server "adjustbonusclaimblocks <player.name> 5000"
  - narrate "<gray>[<dark_aqua>Token<gray>] <white>You have recieved 5000 claimblocks!"
mcmmotokentask:
  type: task
  debug: false
  script:
  - ^take <player.item_in_hand>
  - inventory close d:<context.inventory>
  - playsound <player> sound:CHEST_OPEN volume:0.8 pitch:0.5
  - execute as_server "addlevels <player.name> all 5"
  - narrate "<gray>[<dark_aqua>Token<gray>] <white>You have recieved 5 Mcmmo Levels In All Skills"
cratestokentask:
  type: task
  debug: false
  script:
  - ^take <player.item_in_hand>
  - inventory close d:<context.inventory>
  - playsound <player> sound:CHEST_OPEN volume:0.8 pitch:0.5
  - execute as_server "crate key all common"
  - narrate "<gray>[<dark_aqua>Token<gray>] <white>You gave all online players a common crate key!"
7500tokentask:
  type: task
  debug: false
  script:
  - ^take <player.item_in_hand>
  - inventory close d:<context.inventory>
  - playsound <player> sound:CHEST_OPEN volume:0.8 pitch:0.5
  - execute as_server "money give all 7500"
  - narrate "<gray>[<dark_aqua>Token<gray>] <white>You gave all online players $7500!"
5000tokentask:
  type: task
  debug: false
  script:
  - ^take <player.item_in_hand>
  - inventory close d:<context.inventory>
  - playsound <player> sound:CHEST_OPEN volume:0.8 pitch:0.5
  - execute as_server "money give all 5000"
  - narrate "<gray>[<dark_aqua>Token<gray>] <white>You gave all online players $5000!"




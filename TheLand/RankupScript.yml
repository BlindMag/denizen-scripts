Rankhandlercmd:
    type: command 
    debug: false 
    name: rankhandler
    permission: rankhandler.cmd  
    description: Handles rank messages
    script:
      - choose <context.args.get[1]>:
        - case Initiate:
          - announce "<dark_gray>[<gold><bold>!<dark_gray>] <green><bold><server.match_player[<context.args.get[2]>].name> <dark_aqua>has leveled up and is now <green><bold>Initiate<gold>!"
          - wait 2s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <dark_red>You have reached <gold><underline>level 3<dark_red>! <yellow>Through hard work you have moved further along your path, you have Unlocked the following achievements." target:<server.match_player[<context.args.get[2]>]>
          - wait 5s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <gold>You have recieved an additional Homeset." target:<server.match_player[<context.args.get[2]>]>
          - wait 5s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <yellow>You gained the following abilities:" target:<server.match_player[<context.args.get[2]>]>
          - wait 3s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <gold>You have gained the ability to use <light_purple>Eggs of Catching" target:<server.match_player[<context.args.get[2]>]>
          - wait 3s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <yellow>You have gained the ability to use <dark_aqua>/back" target:<server.match_player[<context.args.get[2]>]>
          - wait 3s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <gold>You have gained the ability to use <dark_aqua>/afk" target:<server.match_player[<context.args.get[2]>]>
          - wait 3s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <yellow>You have gained the ability to use <dark_aqua>/tpahere" target:<server.match_player[<context.args.get[2]>]>
          - wait 3s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <gold>You have gained the ability to sit on stairs." target:<server.match_player[<context.args.get[2]>]>
          - wait 3s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <yellow>You have gained the access to  <dark_aqua>/kit initiate" target:<server.match_player[<context.args.get[2]>]>
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <gold>Crush your <dark_red>enemies<yellow>, honor your allies<yellow>, <dark_red><underline>LIVE<yellow>!" target:<server.match_player[<context.args.get[2]>]>
        - case Apprentice:
          - announce "<dark_gray>[<gold><bold>!<dark_gray>] <green><bold><server.match_player[<context.args.get[2]>].name> <dark_aqua>has leveled up and is now <green><bold>Apprentice<gold>!"

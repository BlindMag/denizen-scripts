          - wait 3s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <yellow>You have gained the access to  <dark_aqua>/kit apprentice" target:<server.match_player[<context.args.get[2]>]>
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <gold>Crush your <dark_red>enemies<yellow>, honor your allies<yellow>, <dark_red><underline>LIVE<yellow>!" target:<server.match_player[<context.args.get[2]>]>

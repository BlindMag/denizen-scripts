          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <gold>You have recieved an additional Homeset." target:<server.match_player[<context.args.get[2]>]>
          - wait 5s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <yellow>You gained the following abilities:" target:<server.match_player[<context.args.get[2]>]>
          - wait 3s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <gold>You have gained the ability to use <dark_aqua>/back <gold>on death" target:<server.match_player[<context.args.get[2]>]>
          - wait 3s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <yellow>You have gained the ability to use <dark_aqua>/entity info" target:<server.match_player[<context.args.get[2]>]>
          - wait 3s
          - narrate "<dark_gray>[<gold><bold>!<dark_gray>] <gold>You have gained the ability to use <dark_aqua>/near" target:<server.match_player[<context.args.get[2]>]>

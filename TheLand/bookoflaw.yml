bookoflaw: 
  type: command 
  name: bookoflaw
  usage: /bookoflaw
  description: obtain the book of law
  debug: true 
  script: 
    - execute as_server "minecraft:give <player.name> written_book{pages:['["",{"text":"WELCOME","color":"gold"},{"text":", ","color":"reset"},{"text":"CHAOS SEED","color":"yellow"},{"text":",\\n","color":"reset"},{"text":"TO THE LAND","color":"gold"},{"text":":\\n","color":"reset"},{"text":"MINECRAFT EDITION","underlined":true,"color":"dark_green"},{"text":".\\n\\n","color":"reset"},{"text":"Disclaimer","color":"dark_red"},{"text":": All the work you see here is done by fans of the series and has some artistic adaptation for both the vision and the limits of Minecraft.","color":"reset"}]','["",{"text":"The Mist Village is an expanding world and will adapt with the books as Dr. Kong writes them.\\n\\n"},{"text":"*","color":"dark_aqua"},{"text":"There are spoilers contained in the interactive space of each location","italic":true,"color":"dark_gray"},{"text":"*","color":"dark_aqua"},{"text":"\\n\\n","color":"reset"},{"text":"Onto The Rules!\\n----------------->","color":"dark_red"}]','["",{"text":"1","color":"dark_red"},{"text":". Thou shalt not advertise or share outside server addresses or streams. There is an Official Mist Village Mafia streamer. All requests or questions regarding this should go through Dr. Kong\'s assistant, Geneva Agnos, via Facebook.","color":"reset"}]','["",{"text":"2","color":"red"},{"text":". Thou shalt not grief other people\'s property. This includes: theft, destruction, etc.\\n","color":"reset"},{"text":"3","color":"gold"},{"text":". No lag machines.\\n","color":"reset"},{"text":"4","color":"yellow"},{"text":". No cheating. This includes, but is not limited to the following:\\n- Hacking\\n- Xray\\n- Exploits","color":"reset"}]','["",{"text":"5","color":"green"},{"text":". Be respectful. All different walks of life exist in The Land. Experience levels also vastly vary. There is zero tolerance for racism, bigotry, etc. This will get you automatically banned from the server.\\n","color":"reset"},{"text":"6","color":"dark_green"},{"text":". During initial development, changes and updates may occur at any time. Your patience is appreciated.","color":"reset"}]','["",{"text":"7","color":"blue"},{"text":". The Survival world is just that, to be built in survival mode only.\\n","color":"reset"},{"text":"8","color":"dark_blue"},{"text":". If you run into issues, reach out to the Village Guard or one of the Captains, Majors, or the General. They are equipped to assist you.\\n ","color":"reset"}]','["",{"text":"9","color":"dark_gray"},{"text":". Staff reserve the right to restrict privileges at any time due to disrespect, dishonesty, disloyalty and rule breaking. This also includes, but is not limited to: loss of rank, in-game fines, restriction of capabilities, etc.","color":"reset"}]','["",{"text":"10","bold":true,"underlined":true},{"text":". Have fun! The only limit you\'ll find here is the limit of your imagination.\\n- - - - - - - - - - - - - - - -\\nTo accept the Book of Law and go on your journey, you must repeat this:\\n\\n\'I vow to uphold the laws of The Land.\'","color":"reset"}]'],title:"Book of Law",author:"The Admins",display:{Lore:["This is the Law of The Land. You must accept this book to continue."]}}"